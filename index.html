<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polux Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#080B1A;
    --navy-mid:#10152E;
    --navy-line:#232A4D;
    --gold-1:#FCE29A;
    --gold-2:#E8A83D;
    --gold-3:#B8720F;
    --white:#F6F7FA;
    --grey:#8991A8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, var(--navy-mid), var(--navy-deep) 65%);
    color:var(--white);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 20px;
    min-height:100vh;
  }
  .page{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}
  .mark{margin-bottom:20px;}
  .brand{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;letter-spacing:0.03em;margin-bottom:6px;}
  .eyebrow{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-2);margin-bottom:8px;}
  .tagline{font-size:14px;color:var(--grey);text-align:center;max-width:300px;margin-bottom:40px;line-height:1.5;}

  .links{width:100%;display:flex;flex-direction:column;gap:14px;}
  .link{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:18px 20px;
    background:var(--navy-mid);
    border:1px solid var(--navy-line);
    border-radius:12px;
    text-decoration:none;
    color:var(--white);
    transition:border-color .2s;
  }
  .link:active{border-color:var(--gold-2);}
  .link .icon{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .link .txt{display:flex;flex-direction:column;gap:2px;}
  .link .txt .t1{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;}
  .link .txt .t2{font-size:12px;color:var(--grey);}
  .link.primary{background:linear-gradient(135deg, rgba(252,226,154,0.12), rgba(184,114,15,0.12));border-color:var(--gold-3);}

  .footer{margin-top:44px;display:flex;align-items:center;gap:10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gold-2);}
  .line{width:60px;height:1px;background:linear-gradient(90deg,var(--gold-2),var(--navy-line));position:relative;}
  .line svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;}
  .footer-txt{font-size:11px;color:var(--grey);margin-top:14px;letter-spacing:0.05em;}
</style>
</head>
<body>
<div class="page">

  <svg class="mark" width="52" height="52" viewBox="0 0 100 100">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE29A"/><stop offset="0.5" stop-color="#E8A83D"/><stop offset="1" stop-color="#B8720F"/>
    </linearGradient></defs>
    <path d="M50 0C50 30 30 50 0 50C30 50 50 70 50 100C50 70 70 50 100 50C70 50 50 30 50 0Z" fill="url(#g1)"/>
  </svg>

  <div class="brand">POLUX COMPANY</div>
  <div class="eyebrow">Performance · Tráfego · Crescimento</div>
  <div class="tagline">Conectamos sua empresa ao público certo, com estratégia baseada em dado.</div>

  <div class="links">

    <a class="link primary" href="https://wa.me/5521966549517?text=Ol%C3%A1%2C%20vim%20pelo%20Instagram%20e%20quero%20um%20or%C3%A7amento" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A83D" stroke-width="1.8"><path d="M20.5 11.5a8.5 8.5 0 01-12.4 7.5L3 20l1.1-5A8.5 8.5 0 1120.5 11.5z"/></svg>
      </span>
      <span class="txt">
        <span class="t1">Pedir orçamento no WhatsApp</span>
        <span class="t2">(21) 96654-9517</span>
      </span>
    </a>

    <a class="link" href="https://www.poluxcompany.com.br" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A83D" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
      </span>
      <span class="txt">
        <span class="t1">Conheça nosso site</span>
        <span class="t2">www.poluxcompany.com.br</span>
      </span>
    </a>

    <a class="link" href="https://instagram.com/poluxcompany" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A83D" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </span>
      <span class="txt">
        <span class="t1">Siga no Instagram</span>
        <span class="t2">@poluxcompany</span>
      </span>
    </a>

  </div>

  <div class="footer">
    <div class="dot"></div>
    <div class="line"><svg viewBox="0 0 100 100"><path d="M50 0C50 30 30 50 0 50C30 50 50 70 50 100C50 70 70 50 100 50C70 50 50 30 50 0Z" fill="url(#g1)"/></svg></div>
    <div class="dot"></div>
  </div>
  <div class="footer-txt">POLUX COMPANY</div>

</div>
</body>
</html>
